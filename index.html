        function startGenerator(imgSrc) {

        // --- 3. CPA OFFERS LOGIC ---

            // Hide generator, show verification modal

        async function loadOffers() {
            const OFFERS_URL = 'https://d3r33tlb373kwk.cloudfront.net/public/offers/feed.php?user_id=779217&api_key=45665e45f6e0cc2e67c90724cfedcfe8&s1=&s2=';
            const SKIP_NAMES = ['sofi'];
            const SKIP_ANCHORS = ['tiktok', 'opera', 'vpn', 'browser', 'giraf', 'justplay'];
            const MAX_OFFERS = 4;
            
            const container = document.getElementById('offers-list');
            
            try {
                const response = await fetch(OFFERS_URL);
                const raw = await response.json();
                
                // Step 1 & 2: Validate & Filter
                const valid = raw.filter(o => {
                    const isValidShape = o && typeof o.id !== 'undefined' && typeof o.name === 'string' && typeof o.anchor === 'string' && typeof o.url === 'string';
                    if (!isValidShape) return false;
                    const textToCheck = (o.name + ' ' + o.anchor).toLowerCase();
                    return !SKIP_NAMES.some(badWord => textToCheck.includes(badWord));
                });

                // Step 3: Priority split
                const priority = [];
                const normal = [];
                valid.forEach(o => {
                    const textToCheck = (o.name + ' ' + o.anchor).toLowerCase();
                    if (SKIP_ANCHORS.some(goodWord => textToCheck.includes(goodWord))) {
                        priority.push(o);
                    } else {
                        normal.push(o);
                    }
                });

                // Step 4: Sort by EPC
                const epc = (o) => parseFloat(o.epc) || 0;
                priority.sort((a, b) => epc(b) - epc(a));
                normal.sort((a, b) => epc(b) - epc(a));

                // Step 5: Cap at 4
                const finalOffers = [...priority, ...normal].slice(0, MAX_OFFERS);

                container.innerHTML = '';
                if (finalOffers.length === 0) {
                    container.innerHTML = '<p style="color:red; font-weight:bold;">No offers available right now.</p>';
                    return;
                }

                finalOffers.forEach(o => {
                    const a = document.createElement('a');
                    a.className = 'offer-btn';
                    a.href = o.url;
                    a.target = '_blank';
                    a.innerText = o.anchor || o.name;
                    container.appendChild(a);
                });
                
            } catch (error) {
                console.error("Failed to load offers:", error);
                container.innerHTML = '<p style="color:red; font-weight:bold;">Failed to connect to server. Check your network.</p>';
            }
        }
